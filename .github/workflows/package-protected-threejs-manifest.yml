name: Package protected Three.js manifest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/implementation-ready-manifest
      - name: Validate and package JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/threejs/Manifiesto_ThreeJS_v3_5_jedl-studio.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          techniques = [t for d in data["domains"] for t in d["techniques"]]
          assert len(data["domains"]) == 42
          assert len(techniques) == 616
          assert all(t.get("application_protection", {}).get("status") == "APPROVED_PROTECTED" for t in techniques)
          assert data["manifest"]["version"] == "3.7.0-jedl-studio-protected-technique-application"
          print(f"Validated {len(data['domains'])} domains / {len(techniques)} protected techniques")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Manifiesto-ThreeJS-v3.7-protegido
          path: docs/threejs/Manifiesto_ThreeJS_v3_5_jedl-studio.json
          if-no-files-found: error
          retention-days: 90
