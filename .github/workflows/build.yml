name: JEDL Studio Android + Avatar Bank CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jedl-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install avatar generator dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pillow
      - name: Generate and test the 42-piece avatar bank
        run: |
          python -m unittest discover -s tools/avatar_bank -p "test_*.py" -v
          test "$(find tools/avatar_bank/out/png -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 42
          mkdir -p app/src/main/assets/characters/jedl_master_v1
          cp tools/avatar_bank/out/manifest.json app/src/main/assets/characters/jedl_master_v1/manifest.json
          cp -R tools/avatar_bank/out/png app/src/main/assets/characters/jedl_master_v1/png
          python tools/avatar_bank/build_style_packs.py
          python tools/content_banks/build_character_presets.py
          test "$(find app/src/main/assets/styles/default/characters -name "*.png" -type f | wc -l)" -eq 42
          test "$(find app/src/main/assets/styles/boceto/characters -name "*.png" -type f | wc -l)" -eq 42
      - name: Download and package the CC0 Kenney character source bank
        run: |
          python tools/process_kenney.py --download
          test -s app/src/main/assets/content/characters/kenney_modular_character_pack/manifest.json
          test "$(find app/src/main/assets/content/characters/kenney_modular_character_pack/png -type f -name '*.png' | wc -l)" -ge 400
      - name: Download and package CC0 object banks
        run: |
          python -m unittest discover -s tools/content_banks -p "test_*.py" -v
          python tools/content_banks/fetch_kenney_cc0.py --pack objects
          python tools/content_banks/fetch_kenney_cc0.py --pack foliage
          for pack in kenney_tiny_town_objects kenney_foliage_objects; do
            test -s "app/src/main/assets/content/$pack/manifest.json"
            test "$(find "app/src/main/assets/content/$pack/png" -type f -name '*.png' | wc -l)" -ge 50
          done
      - name: Upload original Kenney archive for anatomy review
        uses: actions/upload-artifact@v4
        with:
          name: kenney-original-source-zip
          path: build/kenney/kenney.zip
          if-no-files-found: error
      - name: Upload Kenney sprite inventory
        uses: actions/upload-artifact@v4
        with:
          name: kenney-modular-character-inventory
          path: build/kenney/kenney_inventory.json
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verify packaged content bank manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets/content")
          preset_file = root / "character_presets.json"
          presets = json.loads(preset_file.read_text(encoding="utf-8"))
          assert presets["presetCount"] == 8
          assert len(presets["presets"]) == 8
          expected = {
              "characters/kenney_modular_character_pack": 400,
              "kenney_tiny_town_objects": 50,
              "kenney_foliage_objects": 50,
              }
          for relative, minimum in expected.items():
              folder = root / relative
              manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["license"] == "CC0-1.0"
              assert manifest["commercialUse"] and manifest["apkRedistributionAllowed"]
              assert manifest["assetCount"] >= minimum
              assert (folder / "LICENSE.txt").is_file()
              for asset in manifest["assets"]:
                  file = folder / asset["file"]
                  assert file.is_file(), f"Missing bank asset: {file}"
          print("Character source bank and four object banks passed manifest/file/license validation.")
          PY
      - name: Diagnose asset license registry coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets")
          registry = json.loads(Path("licenses/REGISTRY.json").read_text())
          entries = {x["path"] for x in registry["entries"]}
          dirs = [x["path"] for x in registry["directoryEntries"]]
          files = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          missing = sorted(p for p in files if p not in entries and not any(p.startswith(d) for d in dirs))
          print("LICENSE_REGISTRY_UNREGISTERED:", json.dumps(missing, ensure_ascii=False))
          PY
      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify licensed content banks inside APK
        run: python tools/content_banks/verify_apk_content.py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload generated avatar bank
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-avatar-bank-42-png
          path: app/src/main/assets/characters/jedl_master_v1/
          if-no-files-found: error

  mediapipe-standalone:
    name: Clone and build official MediaPipe Pose Landmarker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout JEDL orchestration repository
        uses: actions/checkout@v4

      - name: Clone complete official MediaPipe samples repository
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/mediapipe-samples
          ref: main
          path: mediapipe-samples
          fetch-depth: 0

      - name: Record upstream revision and license
        working-directory: mediapipe-samples
        run: |
          git rev-parse HEAD | tee ../mediapipe-upstream-commit.txt
          cp LICENSE ../MEDIAPIPE-LICENSE.txt
          cp examples/pose_landmarker/android/README.md ../POSE-LANDMARKER-README.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify models, run unit tests, and build debug APK
        working-directory: mediapipe-samples/examples/pose_landmarker/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:verifyModels :android-common:testing:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK and bundled offline models
        working-directory: mediapipe-samples/examples/pose_landmarker/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          expected = {
              "pose_landmarker_lite.task": "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a",
              "pose_landmarker_full.task": "4eaa5eb7a98365221087693fcc286334cf0858e2eb6e15b506aa4a7ecdcec4ad",
              "pose_landmarker_heavy.task": "64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b",
          }
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for name, digest in expected.items():
                  matches = [p for p in names if p.endswith("/" + name) or p == "assets/" + name]
                  assert matches, f"Missing offline model in APK: {name}"
                  actual = hashlib.sha256(z.read(matches[0])).hexdigest()
                  assert actual == digest, f"SHA-256 mismatch for {name}: {actual}"
                  print(f"VERIFIED {name} sha256={actual}")
          print(f"APK_SIZE_BYTES={apk.stat().st_size}")
          PY

      - name: Upload standalone APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-pose-landmarker-android-debug-apk
          if-no-files-found: error
          path: |
            mediapipe-samples/examples/pose_landmarker/android/app/build/outputs/apk/debug/app-debug.apk
            mediapipe-upstream-commit.txt
            MEDIAPIPE-LICENSE.txt
            POSE-LANDMARKER-README.md
