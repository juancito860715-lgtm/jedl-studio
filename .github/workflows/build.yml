name: JEDL Studio Android + Avatar Bank CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jedl-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install avatar generator dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pillow
      - name: Generate and test the 40-piece avatar bank
        run: |
          python -m unittest discover -s tools/avatar_bank -p "test_*.py" -v
          test "$(find tools/avatar_bank/out/png -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 40
          mkdir -p app/src/main/assets/characters/jedl_master_v1
          cp tools/avatar_bank/out/manifest.json app/src/main/assets/characters/jedl_master_v1/manifest.json
          cp -R tools/avatar_bank/out/png app/src/main/assets/characters/jedl_master_v1/png
          python - <<'PY'
          import json
          from pathlib import Path
          registry = Path("licenses/REGISTRY.json")
          data = json.loads(registry.read_text(encoding="utf-8"))
          assets = Path("app/src/main/assets")
          entries = {entry["path"]: entry["license"] for entry in data["entries"]}
          for path in assets.rglob("*"):
              if path.is_file():
                  relative = path.relative_to(assets).as_posix()
                  entries.setdefault(relative, "OWN")
          data["entries"] = [
              {"path": path, "license": license}
              for path, license in sorted(entries.items())
          ]
          registry.write_text(json.dumps(data, indent=2) + "\\n", encoding="utf-8")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload generated avatar bank
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-avatar-bank-40-png
          path: app/src/main/assets/characters/jedl_master_v1/
          if-no-files-found: error
