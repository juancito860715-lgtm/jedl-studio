name: Episode 001 — validate and publish HTML

on:
  pull_request:
    paths:
      - "index.html"
      - "producciones/episodio_001/**"
      - "scripts/validate_episode_001.mjs"
      - ".github/workflows/publish-episode-001.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "producciones/episodio_001/**"
      - "scripts/validate_episode_001.mjs"
      - ".github/workflows/publish-episode-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: episode-001-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate episode structure and timeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 30-second episode
        run: node scripts/validate_episode_001.mjs

  deploy:
    name: Publish site to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package repository site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)"
            if [[ -n "${artifact_id}" ]]; then
              echo "GitHub Pages artifact is visible: ${artifact_id}"
              exit 0
            fi
            echo "Pages artifact not indexed yet (attempt ${attempt}/30)"
            sleep 2
          done
          echo "::error::GitHub Pages artifact was not indexed within 60 seconds"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
