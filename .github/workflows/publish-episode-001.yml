name: Episode 001 — validate and publish HTML

on:
  pull_request:
    paths:
      - "index.html"
      - "producciones/episodio_001/**"
      - "scripts/validate_episode_001.mjs"
      - ".github/workflows/publish-episode-001.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "producciones/episodio_001/**"
      - "scripts/validate_episode_001.mjs"
      - ".github/workflows/publish-episode-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: episode-001-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate episode structure and timeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 30-second episode
        run: node scripts/validate_episode_001.mjs
