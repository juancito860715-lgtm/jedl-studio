name: "Candado de Reglas JEDL"
on:
  pull_request:
    branches: [ main ]

jobs:
  enforce-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verificar actualización de ESTADO_Y_PLAN.md"
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > changed_files.txt
          
          CODE_CHANGED=$(grep -E '^(scripts/|scenes/|tests/)' changed_files.txt || true)
          DOCS_CHANGED=$(grep -E '^docs/ESTADO_Y_PLAN.md' changed_files.txt || true)
          
          if [ -n "$CODE_CHANGED" ] && [ -z "$DOCS_CHANGED" ]; then
            echo "❌ ERROR: Se modificó código pero NO se actualizó docs/ESTADO_Y_PLAN.md."
            echo "Archivos de código modificados: $CODE_CHANGED"
            exit 1
          fi
          echo "✅ Documentación actualizada correctamente."

      - name: "Verificar aprobación del usuario (Etiqueta)"
        if: github.event.pull_request.mergeable_state == 'clean' || github.event.pull_request.mergeable_state == 'unstable'
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          if [[ ! "$LABELS" == *"aprobado-por-usuario"* ]]; then
            echo "❌ ERROR: Falta la etiqueta 'aprobado-por-usuario'."
            exit 1
          fi
          echo "✅ PR aprobada por el usuario."
