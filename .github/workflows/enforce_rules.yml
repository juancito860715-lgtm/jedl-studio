name: "Candado de Reglas JEDL"
on:
  pull_request:
    branches: [ main ]

jobs:
  enforce-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verificar actualización de ESTADO_Y_PLAN.md"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt

          python3 - <<'PY'
          from pathlib import Path
          changed = Path("changed_files.txt").read_text(encoding="utf-8").splitlines()
          code_changed = [
              path for path in changed
              if not path.startswith("docs/")
              and (
                  path.startswith(("assets/", "scripts/", "scenes/", "tests/"))
                  or path.endswith(".gd")
              )
          ]
          docs_changed = "docs/ESTADO_Y_PLAN.md" in changed

          if code_changed and not docs_changed:
              print("ERROR: Se modificó código o assets, pero no se actualizó docs/ESTADO_Y_PLAN.md.")
              print("Archivos detectados:")
              for path in code_changed:
                  print(f" - {path}")
              raise SystemExit(1)

          print("OK: documentación de estado actualizada o no hubo cambios de código/assets.")
          PY
