name: JEDL Studio Godot Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jedl-godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-android:
    name: Godot headless validation and Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK for Godot export
        uses: android-actions/setup-android@v4
      - name: Install SDK, NDK and CMake packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Download pinned Godot 4.4.1 editor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 5 --retry-all-errors https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot/editor.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
      - name: Install matching Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz --output "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$TEMPLATE_DIR/"
      - name: Download animated Fox GLB test character and license
        run: |
          set -euo pipefail
          mkdir -p assets/characters
          curl --fail --location --retry 5 --retry-all-errors https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb --output assets/characters/Fox.glb
          curl --fail --location --retry 5 --retry-all-errors https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/LICENSE.md --output assets/characters/Fox.LICENSE.md
          test -s assets/characters/Fox.glb
          grep -q "CC0-1.0" assets/characters/Fox.LICENSE.md
          grep -q "CC-BY-4.0" assets/characters/Fox.LICENSE.md
      - name: Set up Python for offline 2D asset banks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install asset-bank build dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pillow
      - name: Generate original character pieces and licensed 2D object galleries
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/avatar_bank -p "test_*.py" -v
          mkdir -p assets/gallery/2d/characters/jedl_master_v1
          cp tools/avatar_bank/out/manifest.json assets/gallery/2d/characters/jedl_master_v1/manifest.json
          cp -R tools/avatar_bank/out/png assets/gallery/2d/characters/jedl_master_v1/png
          python tools/content_banks/fetch_kenney_cc0.py --pack objects --out assets/gallery/2d/objects
          python tools/content_banks/fetch_kenney_cc0.py --pack foliage --out assets/gallery/2d/objects
          test "$(find assets/gallery/2d/characters/jedl_master_v1/png -type f -name '*.png' | wc -l)" -eq 42
          test "$(find assets/gallery/2d/objects -type f -name '*.png' | wc -l)" -ge 180
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("assets/gallery/2d")
          for manifest_path in root.rglob("manifest.json"):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("id", "").startswith("kenney_"):
                  assert manifest["license"] == "CC0-1.0"
                  assert manifest["commercialUse"] and manifest["apkRedistributionAllowed"]
                  for asset in manifest["assets"]:
                      assert (manifest_path.parent / asset["file"]).is_file()
          print("GALLERY_2D_BANKS_OK: 42 original rig pieces plus CC0 object/foliage assets")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("assets/gallery/2d")
          entries = []
          for path in sorted((root / "characters/jedl_master_v1/png").rglob("*.png")):
              entries.append({"id": "character:" + path.stem, "title": path.stem.replace("_", " ").title(), "path": "res://" + path.as_posix(), "kind": "2d", "category": "Personaje"})
          for manifest_path in sorted((root / "objects").rglob("manifest.json")):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              for asset in manifest["assets"]:
                  path = manifest_path.parent / asset["file"]
                  entries.append({"id": manifest["id"] + ":" + asset["id"], "title": path.stem.replace("_", " ").title(), "path": "res://" + path.as_posix(), "kind": "2d", "category": asset.get("category", manifest["title"])})
          fox = Path("assets/characters/Fox.glb")
          entries.append({"id": "model:fox", "title": "Fox - Walk", "path": "res://" + fox.as_posix(), "kind": "3d", "category": "Personajes animados"})
          output = Path("assets/gallery/catalog.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"schemaVersion": 1, "assets": entries}, indent=2) + "\\n", encoding="utf-8")
          count2d = sum(item["kind"] == "2d" for item in entries)
          count3d = sum(item["kind"] == "3d" for item in entries)
          assert count2d >= 222 and count3d >= 1, (count2d, count3d)
          print("PACKAGED_CATALOG_OK: 2D=%d 3D=%d" % (count2d, count3d))
          PY
      - name: Import project resources before tests
        run: |
          set -euo pipefail
          test -s project.godot
          test -s export_presets.cfg
          test -s scripts/SceneParser.gd
          test -s tests/scene_parser_test.gd
          test -s tests/catalog_manager_test.gd
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit
          test -d .godot
      - name: Run Godot parser and scene tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          run_godot_test() {
            local test_script="$1"
            echo "::group::Godot test: $test_script"
            timeout --signal=TERM --kill-after=10s 90s "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script "$test_script" --quit-after 120
            echo "::endgroup::"
          }
          run_godot_test res://tests/scene_parser_test.gd
          run_godot_test res://tests/catalog_manager_test.gd
          run_godot_test res://tests/camera_framing_test.gd
          run_godot_test res://tests/scene_parser_smoke.gd
          timeout --signal=TERM --kill-after=10s 30s "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 5
      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Verify Android export preset
        run: |
          set -euo pipefail
          test -s export_presets.cfg
          grep -Fq 'platform="Android"' export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fq 'package/unique_name="studio.jedl.app"' export_presets.cfg
          grep -Fq 'textures/vram_compression/import_etc2_astc=true' project.godot
          grep -Fq 'window/handheld/orientation=6' project.godot
          grep -Fq 'DisplayServer.screen_set_orientation(DisplayServer.SCREEN_SENSOR)' scripts/Main.gd
          grep -Fq 'gradle_build/use_gradle_build=false' export_presets.cfg
          ! grep -Eq '^gradle_build/(min_sdk|target_sdk)=' export_presets.cfg
          test -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          test -n "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          test -n "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
      - name: Export installable Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" build/JEDLStudio-debug.apk
          test -s build/JEDLStudio-debug.apk
          file build/JEDLStudio-debug.apk
          sha256sum build/JEDLStudio-debug.apk | tee build/JEDLStudio-debug.apk.sha256
      - name: Upload Godot Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-godot-android-debug-apk
          path: |
            build/JEDLStudio-debug.apk
            build/JEDLStudio-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
