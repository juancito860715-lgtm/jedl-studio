name: M0 Android CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tests y APK debug
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Subir logs y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-v2-m0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
