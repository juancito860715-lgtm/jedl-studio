name: M0 Android CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install avatar generator dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pillow
      - name: Generate and test the 42-piece avatar bank
        run: |
          python -m unittest discover -s tools/avatar_bank -p "test_*.py" -v
          test "$(find tools/avatar_bank/out/png -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 42
          mkdir -p app/src/main/assets/characters/jedl_master_v1
          cp tools/avatar_bank/out/manifest.json app/src/main/assets/characters/jedl_master_v1/manifest.json
          cp -R tools/avatar_bank/out/png app/src/main/assets/characters/jedl_master_v1/png
          python tools/avatar_bank/build_style_packs.py
          test "$(find app/src/main/assets/styles/default/characters -name "*.png" -type f | wc -l)" -eq 42
          test "$(find app/src/main/assets/styles/boceto/characters -name "*.png" -type f | wc -l)" -eq 42
          test -s app/src/main/assets/characters/jedl_master_v1/manifest.json
          test "$(find app/src/main/assets/characters/jedl_master_v1/png -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 42
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {"torso", "head", "armUL", "foreArmL", "armUR", "foreArmR",
                      "thighL", "shinL", "thighR", "shinR"}
          for style in ("default", "boceto"):
              root = Path("app/src/main/assets/styles") / style
              manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["rigId"] == "jedl_humanoid_v1", style
              assert set(manifest["rigBones"]) == expected, style
              assert len(manifest["parts"]) == 42, style
              assert len(manifest["defaults"]) == 23, style
          print("Both generated styles satisfy the shared humanoid rig and 23-slot default contract.")
          PY
      - name: Download and inspect RGS_Dev CC0 character archive
        run: |
          set -euo pipefail
          mkdir -p temp_rgs
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://opengameart.org/sites/default/files/free_2d_animated_vector_game_character_sprites.zip" -o /tmp/rgs_characters.zip
          test -s /tmp/rgs_characters.zip
          unzip -q /tmp/rgs_characters.zip -d temp_rgs
          python tools/inspect_rgs.py --root temp_rgs --output rgs_inventory.json
      - name: Upload RGS forensic inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgs-character-png-inventory
          path: rgs_inventory.json
          if-no-files-found: warn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify avatar assets are packaged inside APK
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file(), f"APK not found: {apk}"
          expected = [
              "assets/styles/default/manifest.json",
              "assets/styles/boceto/manifest.json",
          ]
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for item in expected:
                  assert item in names, f"Missing from APK: {item}"
              assert not any(name.startswith("assets/styles/kenney/") for name in names), "Unvalidated Kenney art must not enter the APK"
              manifests = {}
              for style in ("default", "boceto"):
                  manifest_path = f"assets/styles/{style}/manifest.json"
                  manifest = json.loads(archive.read(manifest_path))
                  manifests[style] = manifest
                  pngs = [name for name in names if name.startswith(f"assets/styles/{style}/characters/") and name.endswith(".png")]
                  assert len(pngs) == 42, f"Expected 42 {style} PNGs, found {len(pngs)}"
                  assert manifest["rigId"] == "jedl_humanoid_v1", style
                  assert len(manifest["rigBones"]) == 10, style
                  assert len(manifest["defaults"]) == 23, style
              assert manifests["default"]["rigBones"] == manifests["boceto"]["rigBones"]
              assert manifests["default"]["defaults"] == manifests["boceto"]["defaults"]
          print(f"Verified both style manifests, shared rig contract and 84 PNGs inside {apk}")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-v2-m0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload generated avatar bank
        uses: actions/upload-artifact@v4
        with:
          name: jedl-studio-avatar-bank-42-png
          path: app/src/main/assets/characters/jedl_master_v1/
          if-no-files-found: error
