name: Validate Three.js Manifest

on:
  push:
    paths:
      - "docs/threejs/Manifiesto_ThreeJS_Diccionario_Tecnico_v3_1_Integrado.json"
      - "tools/threejs_manifest_audit.py"
      - "tests/threejs/**"
      - ".github/workflows/validate-threejs-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run R31 numerical reference tests
        run: python -m unittest discover -s tests/threejs -p "test_*.py" -v
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript CPU parity tests
        run: node --test tests/threejs/r31_kernels.test.mjs
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock three@0.180.0 playwright@1.56.1 pngjs@7.0.0
      - name: Install Chromium with SwiftShader
        run: npx playwright install --with-deps chromium
      - name: Run real WebGL2 integration test
        run: node --test tests/threejs/browser/webgl2.test.mjs
      - name: Run native WebGPU TSL integration test
        run: node --test tests/threejs/browser/webgpu-tsl.test.mjs
      - name: Run structural and consistency audit
        run: |
          python tools/threejs_manifest_audit.py \
            --manifest docs/threejs/Manifiesto_ThreeJS_Diccionario_Tecnico_v3_1_Integrado.json \
            --report threejs-manifest-audit.json
      - name: Publish report into repository
        if: always() && hashFiles('threejs-manifest-audit.json') != ''
        run: |
          mkdir -p docs/threejs/audit
          cp threejs-manifest-audit.json docs/threejs/audit/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/threejs/audit/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Three.js manifest audit report"
            git push
          fi
      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs-manifest-audit
          path: threejs-manifest-audit.json
          if-no-files-found: warn
