<!doctype html>
<html><head><meta charset="utf-8"><title>Three.js WebGL2 probe</title></head>
<body><canvas id="probe" width="1" height="1"></canvas>
<script type="module">
import * as THREE from "/node_modules/three/build/three.module.js";
const canvas=document.getElementById("probe");
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:"low-power"});
renderer.setSize(1,1,false);
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
const gl=renderer.getContext();
if(!(gl instanceof WebGL2RenderingContext)) throw new Error("Three.js did not create WebGL2");
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z=1;
const material=new THREE.ShaderMaterial({
  glslVersion:THREE.GLSL3,
  vertexShader:"void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"out vec4 fragColor; void main(){fragColor=vec4(0.25,0.5,0.75,1.0);}",
  toneMapped:false
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));
renderer.compile(scene,camera);
// Compile and execute a GLSL ES 3.00 probe directly on the WebGL2 context
// owned by Three.js, then read the actual framebuffer pixel.
const vs=gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, `#version 300 es
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`);
gl.compileShader(vs);
if(!gl.getShaderParameter(vs,gl.COMPILE_STATUS)) throw new Error("Vertex shader: "+gl.getShaderInfoLog(vs));
const fs=gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, `#version 300 es
precision highp float;
out vec4 outColor;
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.0)/k;return min(a,b)-h*h*k*0.25;}
void main(){
  float sdf=smin(0.0,0.0,0.5);
  float fresnel=0.04+(1.0-0.04)*pow(1.0-0.0,5.0);
  float transmittance=exp(-2.0*0.5);
  outColor=vec4(sdf+0.5,fresnel,transmittance,1.0);
}`);
gl.compileShader(fs);
if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)) throw new Error("Fragment shader: "+gl.getShaderInfoLog(fs));
const program=gl.createProgram();
gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error("Program link: "+gl.getProgramInfoLog(program));
gl.useProgram(program);
gl.viewport(0,0,1,1);
gl.disable(gl.BLEND);gl.disable(gl.DITHER);
gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
const pixel=new Uint8Array(4);
gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
window.webgl2Result={
  threeRevision:THREE.REVISION,
  contextVersion:gl.getParameter(gl.VERSION),
  shadingLanguageVersion:gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
  pixel:Array.from(pixel),
  shaderCompile:true,
  threeRendererCompile:true
};
renderer.dispose();
</script></body></html>
