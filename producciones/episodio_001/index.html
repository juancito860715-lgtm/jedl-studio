<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),art=$('art'),sub=$('subtitle'),progress=$('progress'),end=$('end'),controls=$('controls');
const shots=[{t:0,v:'viewBox(0 0 1600 900)'},{t:3.5,v:'viewBox(330 130 700 590)'},{t:8.5,v:'viewBox(850 180 570 570)'},{t:13.5,v:'viewBox(330 130 700 590)'},{t:17.5,v:'viewBox(720 360 470 330)'},{t:20,v:'viewBox(850 180 570 570)'},{t:24.5,v:'viewBox(330 130 700 590)'},{t:27,v:'viewBox(0 0 1600 900)'}];
const lines=[{t:4,d:4.6,who:'inventor',text:'¿Sabes por qué nunca dejo de reparar estas máquinas?'},{t:9,d:4.5,who:'nina',text:'¿Porque todavía guardan muchos secretos?'},{t:14,d:4.7,who:'inventor',text:'¡Exactamente! Cada engranaje cuenta una historia.'},{t:20,d:4.5,who:'nina',text:'Entonces quiero aprender a descubrirlas.'},{t:25,d:4.5,who:'inventor',text:'Ven, hoy comienza tu primera aventura.'}];
let running=false,muted=false,startAt=0,elapsedBeforePause=0,spoken=new Set(),voice=null,raf=0;
function voices(){if(!('speechSynthesis'in window))return;voice=speechSynthesis.getVoices().find(v=>/^es(-|_|$)/i.test(v.lang))||null}
if('speechSynthesis'in window){voices();speechSynthesis.addEventListener('voiceschanged',voices)}
function say(line){if(muted||!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line.text);u.lang=voice?.lang||'es-ES';u.voice=voice||null;u.rate=line.who==='nina'?1.02:.91;u.pitch=line.who==='nina'?1.12:.83;speechSynthesis.speak(u)}
function shotAt(t){let i=0;while(i<shots.length-1&&shots[i+1].t<=t)i++;const a=shots[i],b=shots[Math.min(i+1,shots.length-1)],f=b.t===a.t?0:Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t)));art.setAttribute('viewBox',a.v.slice(8,-1));if(i<shots.length-1&&f>.0){const av=a.v.slice(8,-1).split(' ').map(Number),bv=b.v.slice(8,-1).split(' ').map(Number);const e=f*f*(3-2*f);art.setAttribute('viewBox',av.map((n,j)=>n+(bv[j]-n)*e).join(' '))}}
function pose(t,who){const old=$('inventor'),girl=$('girl');old.classList.toggle('speaking',who==='inventor');girl.classList.toggle('speaking',who==='nina');$('oldLeft').style.transform=who==='inventor'?'rotate(-13deg)':'rotate(0deg)';$('oldRight').style.transform=who==='inventor'?'rotate(18deg)':'rotate(0deg)';$('girlLeft').style.transform=who==='nina'?'rotate(-12deg)':'rotate(0deg)';$('girlRight').style.transform=who==='nina'?'rotate(12deg)':'rotate(0deg)';}
function tick(now){if(!running)return;const t=(now-startAt)/1000;shotAt(t);const active=[...lines].reverse().find(x=>t>=x.t&&t<x.t+x.d);pose(t,active?.who);if(active){sub.textContent=active.text;sub.classList.add('show');if(!spoken.has(active.t)){spoken.add(active.t);say(active)}}else{sub.classList.remove('show')}progress.style.width=Math.min(100,t/30*100)+'%';if(t>=30){finish();return}raf=requestAnimationFrame(tick)}
function finish(){running=false;elapsedBeforePause=30;cancelAnimationFrame(raf);pose(30,null);sub.classList.remove('show');controls.style.display='flex';end.style.display='grid';progress.style.width='100%';$('start').textContent='▶ VOLVER A VER';if('speechSynthesis'in window)speechSynthesis.cancel()}
function start(reset=false){if(running)return;if(reset||elapsedBeforePause>=30){elapsedBeforePause=0;spoken.clear()}if('speechSynthesis'in window)speechSynthesis.cancel();end.style.display='none';controls.style.display='none';sub.classList.remove('show');startAt=performance.now()-elapsedBeforePause*1000;running=true;$('start').textContent='▶ CONTINUAR EPISODIO';raf=requestAnimationFrame(tick)}
$('start').addEventListener('click',()=>start(false));$('again').addEventListener('click',()=>start(true));$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'VOZ SILENCIADA':'VOZ ACTIVADA';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){elapsedBeforePause=Math.min(30,Math.max(0,(performance.now()-startAt)/1000));running=false;cancelAnimationFrame(raf);if('speechSynthesis'in window)speechSynthesis.cancel();controls.style.display='flex';$('start').textContent='▶ CONTINUAR EPISODIO';sub.classList.remove('show')} });
})();
