<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160d09">
<title>JEDL Studio · El secreto del viejo taller</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d09;color:#fff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-size:11px;letter-spacing:.16em;color:#f0d4a5;text-shadow:0 2px 8px #000}
#status{position:absolute;top:38px;left:16px;right:16px;font-size:11px;color:#f5e3c9;text-shadow:0 2px 8px #000}
#subtitle{position:absolute;left:6%;right:6%;bottom:calc(12% + env(safe-area-inset-bottom));min-height:2.5em;padding:12px 16px;border-radius:14px;background:#160d09d9;text-align:center;font-size:clamp(17px,4.3vw,25px);font-weight:700;line-height:1.22;text-shadow:0 2px 5px #000;box-shadow:0 8px 28px #0006}
#controls{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:4}
button{pointer-events:auto;border:1px solid #e1bd7d;background:#382418;color:#fff;border-radius:30px;padding:12px 19px;font-size:14px;font-weight:700;box-shadow:0 4px 16px #0006}button:disabled{opacity:.55}
#progress{position:absolute;bottom:0;left:0;height:4px;background:#e3b96e;width:0}
#end{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#100905b8;font-size:23px;font-weight:700;pointer-events:auto}
@media(max-height:650px){#subtitle{bottom:14%;font-size:16px;padding:9px}#status{top:34px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div id="brand">JEDL STUDIO · PRODUCCIÓN 001</div><div id="status">Preparando el taller…</div><div id="subtitle"></div><div id="progress"></div><div id="end">Fin de la escena<br><button id="again">Reproducir otra vez</button></div></div>
<div id="controls"><button id="start" disabled>▶ Iniciar escena · 30 s</button><button id="mute">Voz: activada</button></div>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x21130c);
scene.fog=new THREE.Fog(0x21130c,18,34);
const camera=new THREE.PerspectiveCamera(innerWidth<700?47:39,innerWidth/innerHeight,.1,80);
camera.position.set(0,5.0,15.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffdfb8,0x35180e,2.0));
const key=new THREE.DirectionalLight(0xffd4a0,3.1);key.position.set(-4,9,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const warm=new THREE.PointLight(0xff9b48,95,19);warm.position.set(4,4,1);scene.add(warm);
const fill=new THREE.PointLight(0xffd6a0,35,15);fill.position.set(-5,3,4);scene.add(fill);

const mat=(color,rough=.75,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const wood=mat(0x60351f),woodLight=mat(0x9a5c31),darkWood=mat(0x321b12),gold=mat(0xc58a3f,.32,.72),iron=mat(0x493a2d,.4,.7);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,32),mat(0x57301d));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.receiveShadow=true;scene.add(floor);
function block(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function sphere(parent,x,y,z,sx,sy,sz,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;parent.add(m);return m}
const wall=new THREE.Group();scene.add(wall);
block(wall,16,5.5,.5,darkWood,0,3.0,-4.3);
for(let x=-7;x<=7;x+=2.3)block(wall,.1,5.2,.12,woodLight,x,3,-4.0);
block(wall,16,.18,.7,woodLight,0,5.65,-4.0);
for(let i=0;i<7;i++)block(wall,1.35,.1,.18,woodLight,-6+i*2,1.4+(i%3)*.55,-3.92);
const gears=[];
function gear(r,teeth,x,y,z,speed){
 const g=new THREE.Group();g.position.set(x,y,z);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(r*.75,r*.18,8,40),gold);g.add(ring);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.32,r*.32,.22,24),gold);hub.rotation.x=Math.PI/2;g.add(hub);
 for(let i=0;i<teeth;i++){const a=i/teeth*Math.PI*2;const t=block(g,r*.25,.2,r*.34,gold,Math.cos(a)*r*.88,Math.sin(a)*r*.88,0);t.rotation.z=a}
 for(let i=0;i<6;i++){const s=block(g,.09,r*.65,.14,iron,0,0,0);s.rotation.z=i*Math.PI/3}
 scene.add(g);gears.push({g,speed});
}
gear(1.25,12,-4.6,4.1,-3.65,.24);gear(.72,10,-2.3,4.7,-3.6,-.32);gear(1.0,14,3.1,4.1,-3.6,.19);gear(.58,9,5.25,5.0,-3.6,-.27);

// Workbench built into the scene: no remote model downloads.
const bench=new THREE.Group();scene.add(bench);
block(bench,5.3,.22,1.45,wood,0,1.55,-.05);
block(bench,5.35,.12,1.5,woodLight,0,1.72,-.05);
for(const x of [-2.35,2.35]){block(bench,.22,1.55,.22,darkWood,x,.78,-.48);block(bench,.22,1.55,.22,darkWood,x,.78,.42)}
block(bench,4.7,.12,.16,woodLight,0,.62,-.45);
block(bench,1.0,.12,.45,mat(0x21833c),0,1.88,-.02);
for(let i=0;i<8;i++)block(bench,.09,.12,.08,mat(0x145b2d),-.38+i*.11,1.91,.22);
const smallGear=new THREE.Mesh(new THREE.TorusGeometry(.28,.07,8,24),gold);smallGear.position.set(0,2.05,-.3);bench.add(smallGear);
block(bench,.48,.6,.38,mat(0x3a4b39),1.75,2.03,-.15);
const cup=new THREE.Mesh(new THREE.CylinderGeometry(.17,.14,.52,16),mat(0xeee0c4));cup.position.set(1.75,2.58,-.15);bench.add(cup);
block(bench,.04,.4,.04,mat(0xc82d22),1.75,3.0,-.15).rotation.z=-.18;

// Original procedural characters: intentionally local, stable, and cast correctly.
const skin=mat(0xc98758),skinLight=mat(0xe0a36f),white=mat(0xf0e8d8),black=mat(0x211914),eye=mat(0x17120f,.3),green=mat(0x416b43),red=mat(0x9c3027),pink=mat(0xe58ba8),pinkDark=mat(0x9f536c),blue=mat(0x31465c);
function makePerson(kind,x,z){
 const isOld=kind==='inventor',root=new THREE.Group();root.position.set(x,0,z);scene.add(root);
 const body=new THREE.Group();body.position.y=1.35;root.add(body);
 const torso=sphere(body,0,0,0,isOld?.52:.39,isOld?.65:.48,.32,isOld?green:pink);
 if(isOld){
  // Red overall bib and straps over the green sweater.
  block(body,.64,.55,.12,red,0,-.22,.29);
  for(const sx of [-.22,.22]){const strap=block(body,.13,.52,.1,red,sx,.17,.3);strap.rotation.z=sx<0?-.18:.18}
  sphere(body,0,-.43,.34,.12,.12,.06,gold);
 } else {
  block(body,.16,.65,.1,blue,-.18,.04,.27).rotation.z=-.22;
  block(body,.16,.65,.1,blue,.18,.04,.27).rotation.z=.22;
  block(body,.16,.16,.12,red,0,-.34,.31);
 }
 const head=new THREE.Group();head.position.set(0,isOld?1.02:.78,0);body.add(head);
 sphere(head,0,0,0,isOld?.47:.39,isOld?.5:.43,.38,skin);
 // ears
 for(const sx of [-1,1])sphere(head,sx*(isOld?.45:.37),-.02,0,.09,.14,.1,skinLight);
 // eyes, pupils and brows
 for(const sx of [-1,1]){
  sphere(head,sx*.16,.04,.335,.105,.12,.045,white);
  sphere(head,sx*.16,.035,.378,.047,.075,.025,eye);
  block(head,.2,.045,.05, isOld?white:darkWood,sx*.16,.22,.34).rotation.z=sx*.08;
 }
 // nose and smile
 sphere(head,0,-.09,.4,.075,.09,.07,skinLight);
 const mouth=block(head,.17,.045,.035,mat(0x6e241c),0,-.22,.365);
 // beard and moustache for the elderly male inventor
 if(isOld){
  const beard=sphere(head,0,-.31,.27,.34,.26,.18,white);
  sphere(head,-.13,-.18,.39,.18,.09,.08,white);sphere(head,.13,-.18,.39,.18,.09,.08,white);
  sphere(head,0,-.39,.38,.2,.13,.08,white);
  // swept-back white hair
  sphere(head,0,.39,-.03,.48,.18,.36,white);
  sphere(head,-.34,.22,-.02,.14,.28,.3,white);sphere(head,.34,.22,-.02,.14,.28,.3,white);
  // glasses
  for(const sx of [-1,1]){const frame=new THREE.Mesh(new THREE.TorusGeometry(.145,.025,6,24),black);frame.position.set(sx*.16,.04,.39);head.add(frame)}
  block(head,.13,.025,.025,black,0,.04,.4);
 } else {
  // Dark bob haircut and pink hair clips.
  sphere(head,0,.34,-.04,.43,.2,.39,black);
  sphere(head,-.35,.08,-.02,.12,.36,.27,black);sphere(head,.35,.08,-.02,.12,.36,.27,black);
  block(head,.11,.06,.035,mat(0xffd36c),-.24,.26,.34).rotation.z=-.35;
 }
 // Neck
 block(body,.19,.22,.2,skin,0,.52,0);
 // Arms on pivots for dialogue gestures.
 const arms=[];
 for(const sx of [-1,1]){
  const pivot=new THREE.Group();pivot.position.set(sx*(isOld?.43:.34),.27,0);body.add(pivot);
  const sleeve=sphere(pivot,sx*.22,-.13,0,.27,.19,.2,isOld?green:pink);
  const fore=sphere(pivot,sx*.43,-.24,.02,.25,.13,.14,isOld?green:pink);
  const hand=sphere(pivot,sx*.65,-.26,.05,.14,.13,.13,skinLight);
  arms.push(pivot);
 }
 // Legs and shoes
 for(const sx of [-1,1]){
  block(root,.23,.55,.25,isOld?red:blue,sx*.2,.57,0);
  sphere(root,sx*.2,.24,.13,.2,.12,.31,mat(0x6a4936));
  sphere(root,sx*.2,.24,.33,.2,.1,.16,mat(0x2b211b));
 }
 return {root,body,head,arms,mouth,kind};
}
const inventor=makePerson('inventor',-1.55,.2);
const nina=makePerson('nina',1.55,.25);
const actors={inventor,nina};

// Framing keeps faces and the bench in the visible middle of a tall phone screen.
const mobile=innerWidth<700;
const shots=[
 {t:0,p:[0,5.2,16.8],look:[0,2.45,-.3]},
 {t:3.5,p:[-2.3,4.1,13.0],look:[-1.45,2.45,.1]},
 {t:8.5,p:[2.25,3.9,12.7],look:[1.45,2.3,.1]},
 {t:13.5,p:[-2.0,4.0,12.7],look:[-1.35,2.4,.1]},
 {t:17.5,p:[0,3.3,11.2],look:[0,1.8,-.15]},
 {t:20,p:[2.2,3.8,12.7],look:[1.4,2.35,.1]},
 {t:24.5,p:[-1.9,3.9,12.6],look:[-1.3,2.4,.1]},
 {t:27,p:[0,5.0,16.2],look:[0,2.35,-.3]}
];
const scripts=[
 {t:4,d:3.8,who:'inventor',text:'¿Sabes por qué nunca dejo de reparar estas máquinas?'},
 {t:9,d:3.5,who:'nina',text:'¿Porque todavía guardan muchos secretos?'},
 {t:14,d:4.2,who:'inventor',text:'¡Exactamente! Cada engranaje cuenta una historia.'},
 {t:20,d:3.6,who:'nina',text:'Entonces quiero aprender a descubrirlas.'},
 {t:25,d:4.2,who:'inventor',text:'Ven, hoy comienza tu primera aventura.'}
];
const status=document.getElementById('status'),subtitle=document.getElementById('subtitle'),progress=document.getElementById('progress'),end=document.getElementById('end');
let running=false,elapsed=0,last=0,muted=false,spoken=new Set(),audioCtx=null,spanishVoice=null,activeSpeaker=null;
function refreshVoices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();spanishVoice=vs.find(v=>/^es([_-]|$)/i.test(v.lang))||null}
if('speechSynthesis'in window){refreshVoices();speechSynthesis.addEventListener('voiceschanged',refreshVoices)}
function cameraAt(t){let i=0;while(i<shots.length-1&&shots[i+1].t<=t)i++;const a=shots[i],b=shots[Math.min(i+1,shots.length-1)],f=b.t===a.t?0:THREE.MathUtils.clamp((t-a.t)/(b.t-a.t),0,1),e=f*f*(3-2*f);camera.position.lerpVectors(new THREE.Vector3(...a.p),new THREE.Vector3(...b.p),e);camera.lookAt(new THREE.Vector3(...a.look).lerp(new THREE.Vector3(...b.look),e))}
function speak(s){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.text);u.lang=spanishVoice?.lang||'es-ES';u.rate=s.who==='nina'?1.02:.88;u.pitch=s.who==='nina'?1.12:.78;if(spanishVoice)u.voice=spanishVoice;speechSynthesis.speak(u)}
function startAmbience(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.13;master.connect(audioCtx.destination);const notes=[110,164.81,220,261.63,293.66,261.63,196,220,261.63,329.63,293.66,220];notes.forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+.2+i*2.1;o.type=i<2?'triangle':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(i<2?.018:.032,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.9)});audioCtx.resume()}catch(e){status.textContent='Audio no disponible; los subtítulos siguen activos.'}}
function animate(t){
 for(const [id,a] of Object.entries(actors)){const speaking=activeSpeaker===id,phase=t*5+(id==='nina'?1.2:0);a.head.rotation.z=Math.sin(t*1.15+(id==='nina'?1:0))*.025+(speaking?Math.sin(phase)*.035:0);a.body.position.y=1.35+Math.sin(t*2+(id==='nina'?1:0))*.025;a.arms.forEach((arm,i)=>{const side=i===0?-1:1;arm.rotation.z=(speaking?side*(id==='inventor'?.38:.22):side*.04)+Math.sin(phase*.7+i)*.035});a.mouth.scale.y=speaking?.9+Math.max(0,Math.sin(phase*2))*.8:.35}
 for(const g of gears)g.g.rotation.z+=g.speed*.016;
 smallGear.rotation.z+=.025;
}
function render(){renderer.render(scene,camera)}
function tick(now){if(!running)return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;animate(elapsed);cameraAt(elapsed);for(const s of scripts){if(elapsed>=s.t&&!spoken.has(s.t)){spoken.add(s.t);subtitle.textContent=s.text;speak(s)}}const active=[...scripts].reverse().find(s=>elapsed>=s.t&&elapsed<s.t+s.d);activeSpeaker=active?.who||null;if(!active&&elapsed<4)subtitle.textContent='';progress.style.width=Math.min(100,elapsed/30*100)+'%';render();if(elapsed>=30){running=false;subtitle.textContent='';document.getElementById('controls').style.display='flex';end.style.display='grid';if(audioCtx){audioCtx.close();audioCtx=null}return}requestAnimationFrame(tick)}
function start(){if(running)return;running=true;elapsed=0;spoken.clear();activeSpeaker=null;end.style.display='none';document.getElementById('controls').style.display='none';subtitle.textContent='';if(window.speechSynthesis)speechSynthesis.cancel();startAmbience();last=performance.now();requestAnimationFrame(tick)}
document.getElementById('start').addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent='Voz: '+(muted?'silenciada':'activada');if(muted&&window.speechSynthesis)speechSynthesis.cancel()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?47:39;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));render()});
status.textContent='Taller y personajes integrados. No se requieren modelos 3D externos.';
document.getElementById('start').disabled=false;
cameraAt(0);render();
</script>
</body></html>
